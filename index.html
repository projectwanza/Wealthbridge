<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WealthBridge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14183f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WealthBridge">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root{--navy:#14183f;--pur:#6b3df0;--grn:#10a24f;--red:#d93b4a;--bg:#f6f7fb;--card:#fff;--tx:#1c2033;--mut:#6b7190;--bd:#e6e8f2}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}
button,input,select{font:inherit}a{color:var(--pur)}
.brand{font-weight:800;font-size:20px;color:var(--navy)}.brand b{color:var(--pur)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(20,24,63,.05)}
.btn{background:linear-gradient(135deg,var(--navy),var(--pur));color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.sec{background:#eeeafd;color:var(--pur)}.btn.sm{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.5}
input,select{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:#fff;margin:4px 0 12px}
label{font-size:13px;font-weight:600;color:var(--mut)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .card{width:100%;max-width:400px}
.auth h2{margin:14px 0 4px}.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.err{background:#fdecee;color:var(--red);padding:9px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);z-index:6}
nav a{flex:1;text-align:center;padding:9px 2px;font-size:11px;color:var(--mut);text-decoration:none;cursor:pointer;position:relative}
nav a i{display:block;font-style:normal;font-size:19px}nav a.on{color:var(--pur);font-weight:700}
nav a em{position:absolute;top:4px;right:22%;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
main{padding:16px;max-width:1000px;margin:auto}h3{margin:20px 0 10px;color:var(--navy)}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}.stat small{color:var(--mut);display:block}.stat b{font-size:20px;color:var(--navy)}
.hero{background:linear-gradient(135deg,var(--navy),var(--pur));color:#fff;border:0}.hero b{color:#fff;font-size:30px}.hero small{color:#d9d2ff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#eef;color:var(--pur)}
.Success,.Active,.Verified,.Approved{background:#e3f6ea;color:var(--grn)}.Failed,.Rejected,.Suspended,.Cancelled{background:#fdecee;color:var(--red)}.Pending,.Paused{background:#fff4dd;color:#b36b00}
.bar{height:8px;border-radius:6px;background:#eceefa;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),var(--grn))}
.sk{height:70px;border-radius:16px;background:linear-gradient(90deg,#eceefa 25%,#f8f9fe 50%,#eceefa 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.modal{position:fixed;inset:0;background:rgba(20,24,63,.5);display:grid;place-items:end center;z-index:20}.modal .card{width:100%;max-width:460px;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:30}
@media(min-width:900px){body{padding:0 0 0 220px}nav{top:0;bottom:auto;width:220px;right:auto;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:80px 12px}
nav a{flex:0;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px}nav a i{display:inline;margin-right:10px}nav a.on{background:#eeeafd}nav a em{position:static;margin-left:8px}
.grid{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}.modal .card{border-radius:22px}.top{padding-left:24px}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.Completed,.Paid{background:#e3f6ea;color:var(--grn)}.wbtn{display:flex;gap:8px;margin-top:16px}.wbtn button{flex:1;min-width:0;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:12px;padding:10px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}.wbtn button:hover{background:rgba(255,255,255,.26)}.wbtn svg{width:20px;height:20px}.grid.w3{grid-template-columns:repeat(2,1fr)}.grid.w3 b{font-size:17px}@media(min-width:900px){.grid.w3{grid-template-columns:repeat(3,1fr)}.wbtn{max-width:480px}.wbtn button{flex-direction:row;justify-content:center;gap:8px;padding:11px}}
/* ===== Invest redesign (added) ===== */
.pc{margin-bottom:14px;padding:20px;border-radius:20px}
.pc-n{font-size:18px;color:var(--navy)}
.pc-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.pc-g>div{background:#f6f4ff;border-radius:14px;padding:10px 12px;min-width:0}
.pc-g small,.pc-f small{display:block;color:var(--mut);font-size:12px}
.pc-g b{display:block;color:var(--navy);font-size:16px}
.pc-g em{font-style:normal;font-size:12px;color:var(--mut)}
.pc-f>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pc-f span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eeeafd;color:var(--pur)}
.pc-b{width:100%;margin-top:16px;padding:14px;font-size:16px;box-shadow:0 8px 18px rgba(107,61,240,.3)}
.modal .card{overflow-x:hidden}
.iv-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.iv-t{font-size:19px;font-weight:800;color:var(--navy)}
.iv-x{border:0;background:#f1f1f8;border-radius:50%;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer;color:var(--mut);flex:none}
.iv-s{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--navy);margin:6px 0 6px}
.iv-s i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pur);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.iv-amt{position:relative}
.iv-amt span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px;color:var(--pur)}
.iv-amt input{margin:0;padding:14px 14px 14px 36px;font-size:22px;font-weight:800;border:2px solid var(--bd);border-radius:14px}
.iv-amt input:focus{outline:0;border-color:var(--pur)}
.iv-h{font-size:12px;color:var(--mut);margin:6px 2px 14px;min-height:16px}.iv-h.bad{color:var(--red)}
.iv-f{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;margin:6px 0 14px}
.iv-f button{border:1.5px solid var(--bd);background:#fff;color:var(--tx);border-radius:14px;padding:11px 4px;font-weight:700;font-size:12.5px;cursor:pointer;min-width:0;transition:.15s}
.iv-f button.on{background:var(--pur);border-color:var(--pur);color:#fff;box-shadow:0 6px 14px rgba(107,61,240,.35)}
.iv-c{background:linear-gradient(160deg,#f6f4ff,#fff);border:1px solid #e3dcff;border-radius:18px;padding:16px;margin:6px 0 12px}
.iv-c h4{margin:0 0 2px;color:var(--navy);font-size:16px}
.iv-big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.2;margin:4px 0 8px;word-break:break-word}
.iv-gp{display:inline-block;background:#e3f6ea;color:var(--grn);font-weight:700;font-size:12px;border-radius:20px;padding:2px 10px;vertical-align:middle}
.iv-note{font-size:11.5px;color:var(--mut);margin-top:10px}
.iv-na{background:#fff4dd;color:#8a5200;border-radius:12px;padding:12px;font-weight:700;font-size:14px;margin-top:8px}
.iv-d{margin:0 0 12px}.iv-d summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--pur);padding:6px 0}
/* ===== 3-year projection card (added) ===== */
.pj{background:linear-gradient(135deg,#2a1f7a 0%,#6b3df0 62%,#8b5cf6 100%);color:#fff;border-radius:20px;padding:16px 18px;margin:4px 0 14px;box-shadow:0 10px 24px rgba(107,61,240,.35);overflow:hidden}
.pj-l{font-size:13px;font-weight:700;opacity:.92}
.pj-s{font-size:12px;opacity:.75;margin-top:2px}
.pj-v{font-size:34px;font-weight:800;line-height:1.15;margin:2px 0 6px;word-break:break-word}
.pj-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;font-weight:600}
.pj-g b{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px}
.pj-g span{opacity:.88}
.pj-n{font-size:10.5px;opacity:.72;margin-top:8px}
@media(max-width:380px){.pj-v{font-size:28px}}
</style></head><body>
<div id="app"></div>
<script>
let TOKEN=null,ME=null,PAGE='dash',PEND={};
const $=s=>document.querySelector(s),inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const GAS_URL='https://script.google.com/macros/s/AKfycbyjveIExT3PTLvlOGarmMkeQ8xoke4kkXud3y2ehGLEg13Sp9GO_UtyGc3hBVz2ddFUnw/exec';
function api(a,p){
  if(typeof google!=='undefined'&&google&&google.script&&google.script.run)return new Promise(r=>google.script.run.withSuccessHandler(x=>r(x||{ok:false,error:'Empty server response. Please try again.'})).withFailureHandler(e=>r({ok:false,error:e.message})).api(a,TOKEN,p||{}));
  return fetch(GAS_URL,{method:'POST',redirect:'follow',body:JSON.stringify({action:a,token:TOKEN,payload:p||{}})}).then(r=>r.json()).then(x=>x||{ok:false,error:'Empty server response. Please try again.'}).catch(()=>({ok:false,error:'Network error. Please check your connection and try again.'}));
}
async function call(a,p){const r=await api(a,p);if(!r.ok){if(r.error==='SESSION_EXPIRED'){TOKEN=null;authView('login','Session expired. Please sign in again.')}throw new Error(r.error)}return r.data}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
const val=id=>$('#'+id).value.trim();
function err(m){const e=$('#err');if(e){e.textContent=m;e.hidden=!m}}
async function act(btn,fn){btn.disabled=true;try{await fn()}catch(e){err(e.message);toast(e.message)}btn.disabled=false}

/* ---------- Auth ---------- */
function authView(v,msg){
  const f={
   login:`<h2>Welcome back</h2><p class="sub">Sign in to your investments.</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" style="width:100%" id="go">Sign in</button><p class="sub" style="margin-top:14px"><a href="#" onclick="authView('reset');return false">Forgot password?</a> · <a href="#" onclick="authView('signup');return false">Create account</a></p>`,
   signup:`<h2>Create your account</h2><p class="sub">Start investing in minutes.</p><label>Full name</label><input id="nm"><label>Mobile number</label><input id="mb" inputmode="numeric" maxlength="10"><label>Email</label><input id="em" type="email"><label>Password (8+ characters, letters and numbers)</label><input id="pw" type="password" autocomplete="new-password"><button class="btn" style="width:100%" id="go">Create account</button><p class="sub" style="margin-top:14px"><a href="#" onclick="authView('login');return false">I already have an account</a></p>`,
   otp:`<h2>Verify your email</h2><p class="sub">Enter the 6-digit code sent to ${esc(PEND.email)}.</p><input id="ot" inputmode="numeric" maxlength="6"><button class="btn" style="width:100%" id="go">Verify</button><p class="sub" style="margin-top:14px"><a href="#" onclick="api('resendOtp',{email:PEND.email});toast('Code sent');return false">Resend code</a></p>`,
   reset:`<h2>Reset password</h2><p class="sub">We will email you a code.</p><label>Email</label><input id="em" type="email"><button class="btn" style="width:100%" id="go">Send code</button><p class="sub" style="margin-top:14px"><a href="#" onclick="authView('login');return false">Back to sign in</a></p>`,
   reset2:`<h2>Choose a new password</h2><label>Code from email</label><input id="ot" inputmode="numeric" maxlength="6"><label>New password</label><input id="pw" type="password" autocomplete="new-password"><button class="btn" style="width:100%" id="go">Update password</button>`}[v];
  $('#app').innerHTML=`<div class="auth"><div class="card"><div class="brand">Wealth<b>Bridge</b></div><p class="sub" style="margin:0">Invest Smart. Build Your Future.</p><div id="err" class="err" ${msg?'':'hidden'} style="margin-top:12px">${esc(msg||'')}</div>${f}</div></div>`;
  $('#go').onclick=e=>act(e.target,async()=>{
    if(v==='login'){const d=await call('login',{email:val('em'),password:$('#pw').value});if(d.needOtp){PEND=d;return authView('otp')}TOKEN=d.token;ME=d.user;shell()}
    if(v==='signup'){const d=await call('register',{name:val('nm'),mobile:val('mb'),email:val('em'),password:$('#pw').value});PEND=d;authView('otp')}
    if(v==='otp'){await call('verifyEmail',{email:PEND.email,otp:val('ot')});authView('login');toast('Email verified. Please sign in.')}
    if(v==='reset'){PEND={email:val('em')};await call('requestReset',PEND);authView('reset2')}
    if(v==='reset2'){await call('resetPassword',{email:PEND.email,otp:val('ot'),password:$('#pw').value});authView('login');toast('Password updated')}
  });
}
/* ---- Wallet (added) ---- */
const inr2=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const minOf=p=>{const m=Object.values(p.rules||{}).filter(c=>c.enabled!==false&&+c.min>0).map(c=>+c.min);return m.length?'From '+inr(Math.min(...m)):'Flexible amount'};
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={plus:svg('<path d="M12 5v14M5 12h14"/>'),up:svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),list:svg('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>')};
async function wallet(){
 const w=await call('wallet');window._w=w;
 const tiles=[['Total money added',w.added],['Total money withdrawn',w.withdrawn],['Total money invested',w.invested],['Total money received',w.credit],['Total money debited',w.debit],['Reserved for withdrawals',w.reserved]];
 $('#main').innerHTML=`<h2>Wallet</h2><p class="sub">Add money, withdraw and track every rupee.</p>
 <div class="card hero stat" style="margin-bottom:12px"><small>WALLET BALANCE</small><b>${inr2(w.balance)}</b>
  <div class="wbtn"><button onclick="wAdd()">${IC.plus}<span>Add Money</span></button><button onclick="wWd()">${IC.up}<span>Withdraw</span></button><button onclick="wTx()">${IC.list}<span>Transactions</span></button></div></div>
 <div class="grid w3">${tiles.map(x=>`<div class="card stat"><small>${x[0]}</small><b>${inr2(x[1])}</b></div>`).join('')}</div>
 <h3>Withdrawal requests</h3><div class="card">${w.withdrawals.length?w.withdrawals.map(t=>`<div class="row"><div><b>${inr2(t.amount)}</b><br><small style="color:var(--mut)">${fd(t.created)} · ${esc(t.id)}</small></div><span class="pill ${t.status}">${t.status}</span></div>`).join(''):'<div class="empty">No withdrawal requests yet.</div>'}</div>`;
}
async function wAdd(){
 if(!document.getElementById('rzcss')){const s=document.createElement('style');s.id='rzcss';s.textContent='#rzslot{margin:0 0 14px;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--bd);box-shadow:0 4px 18px rgba(20,24,63,.08);text-align:center}#rzslot form{margin:0;width:100%}#rzslot .razorpay-payment-button{width:100%!important;max-width:100%;padding:13px 16px!important;border:0!important;border-radius:12px!important;font-weight:700!important;color:#fff!important;background:linear-gradient(135deg,var(--navy),var(--pur))!important;cursor:pointer}';document.head.append(s)}
 let slot=document.getElementById('rzslot');
 if(slot){slot.scrollIntoView({behavior:'smooth',block:'center'});return} // already loading/loaded – never create a second instance
 slot=document.createElement('div');slot.id='rzslot';slot.innerHTML='<div class="sub" style="margin:0">Loading…</div>';
 const hero=document.querySelector('#main .hero');if(hero)hero.after(slot);else $('#main').prepend(slot);
 let pm;try{pm=await call('paymentMode')}catch(e){slot.remove();toast(e.message);return}
 if(pm.mode==='api'){slot.remove();return wAddApi()}
 if(pm.mode!=='button'){slot.remove();toast('Online wallet recharge is currently unavailable.');return}
 slot.innerHTML='';
 try{slot.appendChild(document.createRange().createContextualFragment(pm.buttonCode))}catch(e){slot.remove();toast('Payment button could not be loaded.')}
}
function wAddApi(){
 const m=modal(`<h3 style="margin-top:0">Add money</h3><div id="err" class="err" hidden></div><label>Enter amount (₹)</label><input id="am" type="number" inputmode="decimal" placeholder="e.g. 5000"><label>Payment method</label><select id="pmth"><option value="all">UPI, Card &amp; Net Banking</option><option value="upi">UPI</option><option value="card">Debit / Credit Card</option><option value="netbanking">Net Banking</option></select><button class="btn" style="width:100%" id="go">Continue to payment</button>`);
 $('#go').onclick=e=>act(e.target,async()=>{const o=await call('walletAdd',{amount:$('#am').value});m.remove();wPay(o,$('#pmth').value)});
}
function wPay(o,x){
 const r=new Razorpay({key:o.keyId,amount:o.amount,currency:'INR',name:'WealthBridge Wallet',order_id:o.orderId,prefill:{name:o.name,email:o.email,contact:o.mobile},theme:{color:'#6b3df0'},
  method:x==='all'?undefined:{upi:x==='upi',card:x==='card',netbanking:x==='netbanking',wallet:false},
  handler:async y=>{try{await call('walletConfirm',{txnId:o.txnId,paymentId:y.razorpay_payment_id,signature:y.razorpay_signature});toast('Payment verified. Wallet credited.');wallet()}catch(e){toast(e.message)}},
  modal:{ondismiss:()=>api('walletFailed',{txnId:o.txnId})}});
 r.on('payment.failed',()=>{api('walletFailed',{txnId:o.txnId});toast('Payment failed. Nothing was added.')});r.open();
}
function wWd(){
 const w=window._w,m=modal(`<h3 style="margin-top:0">Withdraw money</h3><div id="err" class="err" hidden></div><p class="sub">Available balance: <b>${inr2(w.balance)}</b><br>Limit: ${inr(w.limits.wdMin)} to ${inr(w.limits.wdMax)} per request</p><label>Withdrawal amount (₹)</label><input id="am" type="number" inputmode="decimal"><label>Receive money in</label><select id="wm"><option value="BANK">Bank account${w.bank?' ('+esc(w.bank)+')':''}</option><option value="UPI">UPI ID</option></select><div id="up" hidden><label>UPI ID</label><input id="ui" placeholder="name@bank"></div><button class="btn" style="width:100%" id="go">Submit withdrawal request</button>`);
 $('#wm').onchange=()=>{$('#up').hidden=$('#wm').value!=='UPI'};
 $('#go').onclick=e=>act(e.target,async()=>{await call('walletWithdraw',{amount:$('#am').value,method:$('#wm').value,upi:$('#ui').value});m.remove();toast('Withdrawal requested');wallet()});
}
async function wTx(){
 window._wl=await call('walletTxns');
 $('#main').innerHTML=`<button class="btn sm sec" onclick="wallet()">← Wallet</button><h2 style="margin:12px 0 8px">Transactions</h2><div class="card" style="margin-bottom:12px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><div><label>Filter</label><select id="wf" onchange="wRender()"><option value="all">All</option><option value="credit">Credit</option><option value="debit">Debit</option><option value="pending">Pending</option><option value="completed">Completed</option></select></div><div><label>From</label><input id="wa" type="date" onchange="wRender()"></div><div><label>To</label><input id="wb" type="date" onchange="wRender()"></div></div></div><div class="card" id="wl"></div>`;wRender();
}
function wRender(){
 const f=$('#wf').value,a=$('#wa').value,b=$('#wb').value,pe=s=>['Pending','Approved'].includes(s);
 const l=window._wl.filter(t=>{const d=String(t.created).slice(0,10);return(f==='all'||(f==='credit'&&t.dir==='CR')||(f==='debit'&&t.dir==='DR')||(f==='pending'&&pe(t.status))||(f==='completed'&&['Completed','Paid'].includes(t.status)))&&(!a||d>=a)&&(!b||d<=b)});

const IVF=['ONE_TIME','DAILY','EVERY_15_DAYS','MONTHLY','HOLD'],IVD=1095;
const IVL={ONE_TIME:'One-time',DAILY:'Daily',EVERY_15_DAYS:'Every 15 Days',MONTHLY:'Monthly',HOLD:'Hold / Lock-in'};
const ivSort=a=>IVF.filter(f=>(a||[]).includes(f));
/* same formula as growthAmt() in Code.gs: highest completed rule only, never summed */
const ivG=(c,a,d)=>{const rs=(c.rules||[]).filter(r=>r.on!==false&&d>=+r.days);if(!rs.length)return 0;const r=rs.reduce((x,y)=>+y.days>+x.days?y:x),q=r.pct/100;return Math.round(a*(Math.pow(1+q,d/365)-1)*100)/100};
const ivMin=p=>{const m=(p.frequencies||[]).map(f=>Math.max(+p.minAmount||0,+((p.rules||{})[f]||{}).min||0)),lo=m.length?Math.min(...m):0;return lo>0?inr(lo):'Any amount'};
function ivGrowth(p){
  let best=null;
  (p.frequencies||[]).forEach(f=>{const c=(p.rules||{})[f]||{};(c.rules||[]).forEach(r=>{if(r.on!==false&&+r.pct>0&&(!best||+r.pct>+best.pct))best={pct:+r.pct,days:+r.days,type:c.type}})});
  if(!best)return{a:'Growth rules apply',b:''};
  return {a:'Up to '+best.pct+'% a year',b:'Compounded growth'};
}
function ivLimits(p,f,L){
  const c=(p.rules||{})[f]||{};let mn=Math.max(+p.minAmount||0,+c.min||0),mx=+c.max||0;
  if(f==='HOLD'){const r=(c.rules||[]).find(x=>x.on!==false&&+x.days===L);if(r){if(+r.min)mn=Math.max(mn,+r.min);if(+r.max)mx=mx?Math.min(mx,+r.max):+r.max}}
  return{mn,mx};
}
/* Hypothetical: each instalment is dated separately and gets its own eligible rule. Returns null when no rule applies. */
function ivHist(p,f,a,L){
  const c=(p.rules||{})[f]||{},rs=(c.rules||[]).filter(r=>r.on!==false&&+r.days>0);
  if(!rs.length||!(a>0))return null;
  if(f==='HOLD'){const r=rs.find(x=>+x.days===L);if(!r||IVD<L)return null;return{n:1,inv:a,g:ivG({type:c.type,compound:c.compound,rules:[r]},a,L)}}
  const T=new Date();T.setHours(0,0,0,0);const s=new Date(T);s.setDate(s.getDate()-IVD);let hold=[];
  if(f==='ONE_TIME')hold=[IVD];
  else{
    const m=+p.tenureMonths||0,cap=m?{DAILY:m*30,EVERY_15_DAYS:m*2,MONTHLY:m}[f]:Infinity;
    for(let i=0;i<cap&&i<2000;i++){
      let x;
      if(f==='MONTHLY'){x=new Date(s.getFullYear(),s.getMonth()+i,1);x.setDate(Math.min(s.getDate(),new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
      else{x=new Date(s);x.setDate(s.getDate()+i*(f==='DAILY'?1:15))}
      if(x>=T)break;
      hold.push(Math.round((T-x)/864e5));
    }
  }
  let g=0,ok=false;hold.forEach(d=>{if(rs.some(r=>d>=+r.days))ok=true;g+=ivG(c,a,d)});
  return ok?{n:hold.length,inv:Math.round(a*hold.length*100)/100,g:Math.round(g*100)/100}:null;
}

async function notif(){
  const l=await call('notifications');api('markRead');
  $('#main').innerHTML=`<h2>Notifications</h2><div class="card">${l.length?l.map(n=>`<div class="row" style="align-items:flex-start"><div><b>${esc(n.title)}</b>${n.read?'':' <span class="pill">new</span>'}<br><span class="sub" style="margin:0">${esc(n.msg)}</span></div><small style="color:var(--mut);white-space:nowrap">${fd(n.created)}</small></div>`).join(''):'<div class="empty">You are all caught up.</div>'}</div>`;
}
async function prof(){
  ME=await call('me');
  $('#main').innerHTML=`<h2>Profile</h2><div class="card"><div class="row"><span>Name</span><b>${esc(ME.name)}</b></div><div class="row"><span>Email</span><b>${esc(ME.email)}</b></div><div class="row"><span>Mobile</span><b>${esc(ME.mobile)}</b></div><div class="row"><span>Account</span><span class="pill ${ME.status}">${ME.status}</span></div><div class="row"><span>KYC</span><span class="pill ${ME.kyc}">${ME.kyc}</span></div></div>
  ${ME.kyc==='Verified'||ME.kyc==='Pending'?`<div class="card" style="margin-top:12px"><b>KYC details</b><div class="row"><span>PAN</span><b>${esc(ME.pan)}</b></div><div class="row"><span>Bank account</span><b>${esc(ME.acct)}</b></div><div class="row"><span>IFSC</span><b>${esc(ME.ifsc)}</b></div></div>`:
  `<h3>Complete KYC</h3><div class="card"><div id="err" class="err" hidden></div><label>PAN</label><input id="pn" maxlength="10" style="text-transform:uppercase"><label>Bank account number</label><input id="ac" inputmode="numeric"><label>IFSC code</label><input id="if" maxlength="11" style="text-transform:uppercase"><button class="btn" id="go">Submit for verification</button></div>`}
  <button class="btn sec" style="margin-top:16px" onclick="logout()">Sign out</button>`;
  const g=$('#go');if(g)g.onclick=e=>act(e.target,async()=>{await call('submitKyc',{pan:val('pn'),acct:val('ac'),ifsc:val('if')});toast('KYC submitted');go('prof')});
}
async function logout(){await api('logout');TOKEN=null;ME=null;authView('login')}
authView('login');
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
let _ip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e;const b=document.createElement('button');b.id='pwaBtn';b.className='btn sm';b.textContent='Install app';b.style.cssText='position:fixed;right:14px;bottom:84px;z-index:25;box-shadow:0 6px 20px rgba(20,24,63,.25)';b.onclick=()=>{b.remove();_ip.prompt();_ip=null};document.body.append(b);pwaShow()});
/* Install button: only on signed-out screens (login/register/OTP/reset) and Home */
function pwaShow(){const b=document.getElementById('pwaBtn');if(b)b.style.display=(!TOKEN||PAGE==='dash')?'':'none'}
new MutationObserver(pwaShow).observe($('#app'),{childList:true,subtree:true});
window.addEventListener('appinstalled',()=>{const b=document.getElementById('pwaBtn');if(b)b.remove()});
</script></body></html>
